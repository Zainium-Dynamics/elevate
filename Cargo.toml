[package]
name = "elevate"
description = "elevate / elev / viselev — memory-safe sudo/su for Zainium"
version = "1.0.1"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/Zainium-Dynamics/elevate"
homepage = "https://zainiumdynamics.tech"
authors = ["alizain <alizain@zainiumdynamics.tech>"]
publish = false
categories = ["command-line-interface"]
exclude = ["docs/man", "target"]
rust-version = "1.96"

default-run = "elevate"

[[bin]]
name = "elevate"
path = "src/bin/elevate.rs"

[[bin]]
name = "elev"
path = "src/bin/elev.rs"

[[bin]]
name = "vielev"
path = "src/bin/vielev.rs"

[dependencies]
libc = "0.2"
glob = "0.3"

[features]
default = []
pam-login = []
apparmor = []
gettext = []
unstable-remote-sudoers = []
dev = []
do-not-use-all-features = []
sudoedit = []

[lints.rust]
unsafe_op_in_unsafe_fn = { level = "deny" }

[lints.clippy]
undocumented_unsafe_blocks = "warn"
